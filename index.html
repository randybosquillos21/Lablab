<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }

    /* ✅ SCROLL ENABLED — body grows with content */
    html, body {
      min-height: 100%;
    }

    body {
      background: linear-gradient(145deg, #1e0033, #3b0b5e, #6a1f9e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;   /* ✅ allow content to grow downward */
      overflow-x: hidden;         /* ✅ hide horizontal scroll but allow vertical */
      overflow-y: auto;           /* ✅ vertical scroll enabled */
      position: relative;
      padding: 20px 16px 60px;
    }

    /* keep decorative floats fixed relative to viewport so they don't scroll away */
    .flower-petal {
      position: fixed;
      font-size: 1.8rem;
      opacity: 0.7;
      user-select: none;
      pointer-events: none;
      animation: floatPetal linear infinite;
      z-index: 1;
    }

    @keyframes floatPetal {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
    }

    .balloon {
      position: fixed;
      font-size: 2.8rem;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
      animation: floatBalloon linear infinite;
    }

    @keyframes floatBalloon {
      0% { transform: translateY(110vh) scale(0.8); opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-20vh) scale(1.1); opacity: 0.2; }
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 230, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(210, 130, 255, 0.3), 0 0 40px #c06bff;
      padding: 30px 25px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
      transition: all 0.3s ease;
      border: 1px solid rgba(220, 150, 255, 0.4);
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .love-scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.5s ease;
      text-align: center;
      padding: 30px 0;
    }

    .love-scene.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
      display: none;
    }

    .heart-big {
      font-size: 7rem;
      animation: beat 1.2s infinite ease-in-out;
      filter: drop-shadow(0 0 25px #d99aff);
      margin-bottom: 10px;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      30% { transform: scale(1.18); }
      50% { transform: scale(0.98); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .click-hint {
      color: #f0d9ff;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(100, 30, 150, 0.35);
      padding: 12px 30px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(230, 180, 255, 0.7);
      box-shadow: 0 0 25px #ba7aff;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px #ba7aff; }
      50% { box-shadow: 0 0 45px #da9cff, 0 0 15px #ffffff; }
      100% { box-shadow: 0 0 15px #ba7aff; }
    }

    .kisses {
      font-size: 2.5rem;
      letter-spacing: 10px;
      margin-top: 25px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-8px); }
      100% { opacity: 0.4; transform: translateY(0); }
    }

    .message-scene {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.6s ease;
    }

    .message-scene.visible {
      display: flex;
      animation: fadeInUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .love-message {
      background: linear-gradient(135deg, rgba(180, 100, 255, 0.3), rgba(255, 200, 255, 0.2));
      border-radius: 50px;
      padding: 25px 30px;
      margin-bottom: 30px;
      border: 1px solid #d9a6ff;
      box-shadow: 0 0 35px #b35eff;
      text-align: center;
      width: 100%;
    }

    .love-message p {
      font-size: 1.9rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 20px #d9a0ff, 0 0 40px #b266ff;
      line-height: 1.4;
      letter-spacing: 1px;
    }

    .love-message span {
      display: block;
      font-size: 1.4rem;
      margin-top: 10px;
      color: #f0d0ff;
      font-weight: 300;
      font-style: italic;
    }

    .gallery-title {
      font-size: 1.8rem;
      color: #f2e0ff;
      text-shadow: 0 0 15px #c47aff;
      margin-bottom: 18px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: center;
      justify-content: center;
    }

    /* ✅ Gallery grid — responsive, wraps, expands with content */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 20px;
      margin: 10px 0 30px;
      width: 100%;
      padding: 0 10px;
    }

    .photo-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 40% 60% 40% 60% / 50% 40% 60% 50%;
      background: linear-gradient(135deg, #d9b0ff, #b77aff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 30px #c278ff, 0 0 15px #ffffff inset;
      transition: all 0.4s ease;
      animation: floatPhoto 3s infinite alternate ease-in-out;
      border: 2px solid #f0cbff;
      color: #3d0066;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      transition: transform 0.4s ease;
      pointer-events: none; /* let card handle click */
    }

    .photo-card:hover img {
      transform: scale(1.1);
    }

    .photo-card:nth-child(1) { animation-delay: 0s; }
    .photo-card:nth-child(2) { animation-delay: 0.4s; }
    .photo-card:nth-child(3) { animation-delay: 0.8s; }
    .photo-card:nth-child(4) { animation-delay: 1.2s; }
    .photo-card:nth-child(5) { animation-delay: 0.2s; }
    .photo-card:nth-child(6) { animation-delay: 0.6s; }
    .photo-card:nth-child(7) { animation-delay: 1.0s; }
    .photo-card:nth-child(8) { animation-delay: 1.4s; }

    @keyframes floatPhoto {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }

    .photo-card:hover {
      transform: scale(1.06) rotate(0deg);
      box-shadow: 0 0 50px #e5aaff, 0 0 30px #ffffff;
    }

    .kiss-row {
      font-size: 2.2rem;
      letter-spacing: 15px;
      margin: 20px 0 10px;
      animation: kissFloat 2.2s infinite;
      filter: drop-shadow(0 0 10px #ff99ff);
    }

    @keyframes kissFloat {
      0% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.8; }
    }

    .bg-heart {
      position: fixed;
      font-size: 2rem;
      opacity: 0.2;
      animation: floatHeart 15s infinite linear;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatHeart {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.1; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* FIREWORKS */
    .firework-particle {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 9999;
      user-select: none;
      will-change: transform, opacity;
    }

    @keyframes fireworkFly {
      0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); opacity: 0; }
    }

    /* MUSIC TOGGLE */
    .music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(150, 70, 220, 0.6);
      border: 2px solid #e0b0ff;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px #c06bff;
      transition: all 0.3s ease;
    }

    .music-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #e0aaff;
    }

    .music-toggle.playing {
      animation: musicPulse 1.5s infinite;
    }

    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 0 25px #c06bff; }
      50% { box-shadow: 0 0 50px #ff99ff, 0 0 20px #ffffff; }
    }

    .unmute-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(100, 30, 150, 0.85);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      border: 1px solid #e0b0ff;
      font-size: 0.95rem;
      z-index: 1000;
      animation: fadeInOut 3s infinite;
      box-shadow: 0 0 20px #c06bff;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ===== ✅ LIGHTBOX (full image + caption) ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 0, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .lightbox.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: lightboxZoom 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes lightboxZoom {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 60px #b35eff, 0 0 100px rgba(200, 120, 255, 0.4);
      border: 2px solid #e0b0ff;
      background: rgba(0,0,0,0.3);
    }

    /* message box under image */
    .lightbox-caption {
      max-width: 90vw;
      background: linear-gradient(135deg, rgba(150, 70, 220, 0.55), rgba(200, 120, 255, 0.35));
      border: 1px solid #e0b0ff;
      border-radius: 30px;
      padding: 18px 28px;

      font-size: 1.3rem;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.5px;
      box-shadow: 0 0 35px #c06bff;
      text-shadow: 0 0 15px #d9a0ff;
      backdrop-filter: blur(10px);
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(150, 70, 220, 0.7);
      border: 2px solid #e0b0ff;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px #c06bff;
    }

    .lightbox-close:hover {
      transform: scale(1.1) rotate(90deg);
      background: #a54bff;
      box-shadow: 0 0 40px #e0aaff;
    }

    @media (max-width: 600px) {
      .heart-big { font-size: 5rem; }
      .click-hint { font-size: 1.2rem; padding: 10px 20px; }
      .love-message p { font-size: 1.5rem; }

      .card { border-radius: 40px 40px 30px 30px; padding: 20px 14px 30px; }

      .lightbox-close { width: 44px; height: 44px; font-size: 1.3rem; top: 12px; right: 12px; }
    }
  </style>
</head>

  <script>
    // ============ MUSIC CONTROL ============
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const unmuteHint = document.getElementById('unmuteHint');
    let musicEnabled = false;

    bgMusic.volume = 0.35;

    function tryPlayMusic() {
      if (!musicEnabled) {
        bgMusic.play().then(() => {
          musicEnabled = true;
          musicToggle.textContent = '🔊';
          musicToggle.classList.add('playing');
          unmuteHint.style.display = 'none';
        }).catch((err) => {
          console.log('Autoplay blocked, waiting for interaction:', err);
        });
      }
    }

    ['click', 'touchstart', 'keydown'].forEach(event => {
      document.addEventListener(event, tryPlayMusic, { once: false, passive: true });
    });

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (musicEnabled) {
        bgMusic.pause();
        musicEnabled = false;
        musicToggle.textContent = '🔇';
        musicToggle.classList.remove('playing');
      } else {
        bgMusic.play().then(() => {
          musicEnabled = true;
          musicToggle.textContent = '🔊';
          musicToggle.classList.add('playing');
          unmuteHint.style.display = 'none';
        }).catch(err => console.log(err));
      }
    });

    // ============ FIREWORK BURST ============
    const fireworkEmojis = ['🌸', '💜', '😘', '💖', '🌷', '🎈', '💕', '🌺', '💐', '💋', '✨', '💗', '❤️', '🌼', '🩷'];

    function createFireworkBurst(originX, originY, count = 60) {
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'firework-particle';
        particle.textContent = fireworkEmojis[Math.floor(Math.random() * fireworkEmojis.length)];

        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.6 - 0.3);
        const distance = 150 + Math.random() * 350;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        const rot = (Math.random() * 720 - 360) + 'deg';
        const duration = 1.2 + Math.random() * 1.2;

        particle.style.left = originX + 'px';
        particle.style.top = originY + 'px';
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        particle.style.setProperty('--rot', rot);
        particle.style.animation = `fireworkFly ${duration}s cubic-bezier(0.15, 0.65, 0.35, 1) forwards`;
        particle.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), duration * 1000 + 200);
      }
    }

    function launchFireworkShow(clickX, clickY) {
      createFireworkBurst(clickX, clickY, 70);
      setTimeout(() => {
        createFireworkBurst(clickX - 120, clickY - 100, 45);
        createFireworkBurst(clickX + 120, clickY - 100, 45);
      }, 250);
      setTimeout(() => {
        createFireworkBurst(clickX - 200, clickY + 50, 35);
        createFireworkBurst(clickX + 200, clickY + 50, 35);
      }, 500);
      setTimeout(() => {
        createFireworkBurst(window.innerWidth / 2, window.innerHeight / 2, 50);
      }, 750);
    }

    // ============ MAIN EXPERIENCE ============
    function startExperience(event) {
      tryPlayMusic();

      let clickX = window.innerWidth / 2;
      let clickY = window.innerHeight / 2;
      if (event) {
        if (event.clientX) { clickX = event.clientX; clickY = event.clientY; }
        else if (event.touches && event.touches[0]) {
          clickX = event.touches[0].clientX;
          clickY = event.touches[0].clientY;
        }
      }

      launchFireworkShow(clickX, clickY);

      const loveScene = document.getElementById('loveScene');
      const messageScene = document.getElementById('messageScene');
      loveScene.classList.add('hidden');

      setTimeout(() => {
        messageScene.classList.add('visible');
      }, 900);

      for (let i = 0; i < 20; i++) {
        setTimeout(() => createFloatingHeart(), i * 120);
      }
    }

    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = ['💜', '💖', '💕', '❤️', '💗', '🌸', '🎈', '😘'][Math.floor(Math.random() * 8)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
      heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
      heart.style.bottom = '-10vh';
      heart.style.opacity = '0.8';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }

    window.addEventListener('load', () => {
      for (let i = 0; i < 6; i++) {
        setTimeout(createFloatingHeart, i * 500);
      }
    });

    // ============ ✅ LIGHTBOX (click photo to see full image + message) ============
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxCaption.textContent = caption || 'I love you 💜';
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden'; // stop background scroll while lightbox is open
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = ''; // restore scrolling
      // clear after fade-out
      setTimeout(() => {
        if (!lightbox.classList.contains('open')) {
          lightboxImg.src = '';
          lightboxCaption.textContent = '';
        }
      }, 350);
    }

    // Delegate click to any .photo-card
    document.getElementById('gallery').addEventListener('click', (e) => {
      const card = e.target.closest('.photo-card');
      if (!card) return;
      const img = card.querySelector('img');
      if (!img) return;
      const caption = card.getAttribute('data-caption') || 'I love you 💜';
      openLightbox(img.src, caption);
    });

    lightboxClose.addEventListener('click', closeLightbox);

    // Close when clicking the dark backdrop (not the image/message)
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Close with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });
  </script>
</body>
</html>
